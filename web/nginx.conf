server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker: permite encontrar "app" aunque cambie su IP o se escale
    resolver 127.0.0.11 valid=10s;

    # La página (HTML, CSS, JS)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Todo lo que empiece con /api/ se reenvía al contenedor "app" (puerto 5000)
    location /api/ {
        set $api http://app:5000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
